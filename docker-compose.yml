# Starts a local Neo4j for crateguard:  docker compose up -d
# Then:  export CRATEGUARD_NEO4J_PASSWORD=crateguard   and   crateguard load
services:
  neo4j:
    image: neo4j:5.26
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/crateguard
    volumes: ["crateguard-neo4j:/data"]
volumes:
  crateguard-neo4j:
